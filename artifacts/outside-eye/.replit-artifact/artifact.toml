kind = "web"
previewPath = "/outside-eye/"
title = "The Outside Eye"
version = "1.0.0"
id = "artifacts/outside-eye"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/outside-eye/" ]
localPort = 20405

[services.development]
run = "pnpm --filter @workspace/outside-eye run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/outside-eye", "run", "build" ]
publicDir = "artifacts/outside-eye/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20405"
BASE_PATH = "/outside-eye/"
